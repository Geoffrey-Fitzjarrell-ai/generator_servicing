name: Daily Morning Digest (Japanese)

on:
  schedule:
    # 07:00 JST == 22:00 UTC previous day
    - cron: '0 22 * * *'
  workflow_dispatch:

jobs:
  morning-digest:
    runs-on: ubuntu-latest

    steps:
      - name: Post morning digest to Slack
        env:
          SLACK_TOKEN: ${{ secrets.SLACK_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          python3 - <<'EOF'
          import os, json, base64, urllib.request
          # --- resilient urlopen: retry transient 5xx/429/network blips ---
          import time as _t, urllib.error as _ue
          def _urlopen(request, timeout=30, _tries=4):
              for _i in range(_tries):
                  try:
                      return urllib.request.urlopen(request, timeout=timeout)
                  except _ue.HTTPError as _e:
                      if _e.code in (429, 500, 502, 503, 504) and _i < _tries - 1:
                          _t.sleep(2 ** _i); continue
                      raise
                  except _ue.URLError:
                      if _i < _tries - 1:
                          _t.sleep(2 ** _i); continue
                      raise
          from datetime import datetime, timezone, timedelta

          SLACK_TOKEN = os.environ["SLACK_TOKEN"]
          GH_TOKEN    = os.environ["GH_TOKEN"]
          CHANNEL     = "C08L1TWLU14"
          REPO        = "Geoffrey-Fitzjarrell-ai/generator_servicing"
          NOW_JST     = datetime.now(timezone.utc) + timedelta(hours=9)

          def slack_post(payload):
              data = json.dumps(payload).encode()
              req = urllib.request.Request(
                  "https://slack.com/api/chat.postMessage", data=data,
                  headers={"Authorization": f"Bearer {SLACK_TOKEN}", "Content-Type": "application/json"},
              )
              with _urlopen(req) as r:
                  return json.loads(r.read())

          def gh_get(path):
              url = f"https://api.github.com/repos/{REPO}/contents/{path}"
              req = urllib.request.Request(url, headers={
                  "Authorization": f"Bearer {GH_TOKEN}",
                  "Accept": "application/vnd.github+json",
              })
              with _urlopen(req) as r:
                  resp = json.loads(r.read())
              return json.loads(base64.b64decode(resp["content"]).decode())

          # ---- Canonical service model: single source of truth (service_model.json) ----
          # Loaded from the repo so genki-kun can NEVER drift from index.html again.
          # type "replace" -> escalates to OVERDUE (red alarm) past interval (oil / fuel /
          # air-filter change). type "service" -> a check or cleaning: past interval it shows
          # a calm DUE state and NEVER raises the red overdue alarm, the overdue count, or a DM.
          # Fallback below matches index.html exactly in case the file fetch ever fails.
          FALLBACK_TASKS = [
              {"key":"airfilter_battery","interval":50, "type":"service","jp":"エアフィルター・バッテリー点検","en":"Air filter / battery check"},
              {"key":"battery_box",      "interval":50, "type":"service","jp":"バッテリーボックス点検",      "en":"Battery box check"},
              {"key":"oil_filter",       "interval":150,"type":"replace","jp":"オイル／フィルター交換",      "en":"Oil / filter change"},
              {"key":"spark_arrestor",   "interval":150,"type":"service","jp":"スパークアレスター清掃",      "en":"Clean spark arrestor"},
              {"key":"airfilter_clean",  "interval":250,"type":"service","jp":"エアフィルター清掃",          "en":"Air filter cleaning","hd5_only":True},
              {"key":"coolant_lines",    "interval":250,"type":"service","jp":"クーラントライン点検",        "en":"Coolant line check"},
              {"key":"fuel_filter",      "interval":500,"type":"replace","jp":"燃料フィルター交換",          "en":"Fuel filter change"},
              {"key":"drive_belt",       "interval":500,"type":"service","jp":"ドライブベルト点検",          "en":"Drive belt check"},
              {"key":"clean_radiator",   "interval":500,"type":"service","jp":"ラジエーター清掃",            "en":"Radiator cleaning"},
              {"key":"airfilter_500",    "interval":500,"type":"replace","jp":"エアフィルター交換",          "en":"Air filter replacement"},
          ]
          try:
              _model = gh_get("service_model.json")
              TASKS = _model.get("tasks") or FALLBACK_TASKS
              print(f"service_model.json v{_model.get('version','?')} loaded ({len(TASKS)} tasks)")
          except Exception as _e:
              TASKS = FALLBACK_TASKS
              print(f"service_model.json load failed ({_e}); using built-in fallback")

          def tasks_for_truck(truck_id):
              return [t for t in TASKS if not t.get("hd5_only") or truck_id == "HD5"]

          fleet    = gh_get("data.json")
          svc_logs = gh_get("service_logs.json")

          def worst_of(tasks, hours, tl):
              worst = None
              for task in tasks:
                  last = tl.get(task["key"])
                  if last is None:
                      last = 0  # never recorded -> measure from 0h
                  since = hours - last
                  ratio = since / task["interval"]
                  if worst is None or ratio > worst["ratio"]:
                      worst = {"task": task, "ratio": ratio, "rem": task["interval"] - since}
              return worst

          # Per-truck: alarm status is driven ONLY by replacement tasks. Service checks
          # past interval are surfaced separately as a calm (non-alarming) note.
          def critical_info(truck_id):
              td = fleet.get(truck_id) or {}
              hours = td.get("hours")
              if td.get("grounded"):
                  return {"status": "grounded", "note": td.get("groundedNote") or "整備・修理中", "hours": hours}
              if not hours:
                  return None
              tl = svc_logs.get(truck_id) or {}
              tt = tasks_for_truck(truck_id)
              wr = worst_of([t for t in tt if t.get("type") == "replace"], hours, tl)
              ws = worst_of([t for t in tt if t.get("type") != "replace"], hours, tl)
              if wr is None:
                  st = "ok"
              elif wr["ratio"] >= 1:
                  st = "overdue"
              elif wr["ratio"] >= 0.9:
                  st = "warn"
              else:
                  st = "ok"
              info = {"status": st, "hours": hours,
                      "task": wr["task"]["jp"] if wr else "",
                      "task_en": (wr["task"].get("en", wr["task"]["jp"]) if wr else ""),
                      "ratio": wr["ratio"] if wr else 0.0,
                      "rem": wr["rem"] if wr else 0.0}
              # calm "check due" note only when a service check is actually past interval
              if ws is not None and ws["ratio"] >= 1:
                  info["check"] = {"task": ws["task"]["jp"],
                                   "task_en": ws["task"].get("en", ws["task"]["jp"]),
                                   "ratio": ws["ratio"], "rem": ws["rem"], "hours": hours}
              else:
                  info["check"] = None
              return info

          def bar(ratio, width=10):
              filled = min(width, max(0, round(min(ratio, 1.0) * width)))
              return "▓" * filled + "░" * (width - filled)

          rows = []
          for t in sorted(fleet.keys(), key=lambda x: int(x[2:])):
              info = critical_info(t)
              if info:
                  rows.append((t, info))

          overdue  = sorted([(t, i) for t, i in rows if i["status"] == "overdue"], key=lambda x: x[1]["rem"])
          warn     = sorted([(t, i) for t, i in rows if i["status"] == "warn"],    key=lambda x: x[1]["rem"])
          checks   = sorted([(t, i) for t, i in rows if i["status"] == "ok" and i.get("check")],
                            key=lambda x: x[1]["check"]["rem"])
          ok       = sorted([(t, i) for t, i in rows if i["status"] == "ok" and not i.get("check")],
                            key=lambda x: x[1]["rem"])
          grounded = [(t, i) for t, i in rows if i["status"] == "grounded"]

          def _fmt(t, hours, ratio, rem, label, jp=True):
              if jp:
                  tail = f"超過{abs(round(rem))}h" if rem <= 0 else f"あと{round(rem)}h"
                  wrap = "（{}）"
              else:
                  tail = f"over {abs(round(rem))}h" if rem <= 0 else f"in {round(rem)}h"
                  wrap = " ({})"
              pct = min(round(ratio * 100), 999)
              return f"{t:<5} {str(hours)+'h':>6} {bar(ratio)} {pct:>3}% {label}{wrap.format(tail)}"

          def row_line(t, i):    return _fmt(t, i["hours"], i["ratio"], i["rem"], i["task"], jp=True)
          def row_line_en(t, i): return _fmt(t, i["hours"], i["ratio"], i["rem"], i["task_en"], jp=False)
          def check_line(t, i):
              c = i["check"]; return _fmt(t, c["hours"], c["ratio"], c["rem"], c["task"], jp=True)

          WEEKDAYS = ["月", "火", "水", "木", "金", "土", "日"]
          header = f"🌅 げんきくん 朝の整備サマリー — {NOW_JST.month}/{NOW_JST.day}（{WEEKDAYS[NOW_JST.weekday()]}）"

          blocks = [{"type": "header", "text": {"type": "plain_text", "text": header, "emoji": True}}]

          def section_with_rows(title, items, liner=row_line):
              body = "\n".join(liner(t, i) for t, i in items)
              blocks.append({"type": "section", "text": {"type": "mrkdwn", "text": f"{title}\n```{body}```"}})

          if overdue:
              section_with_rows("🔴 *整備期限超過（交換作業）— 本日中の対応をお願いします🔧*", overdue)
          if warn:
              section_with_rows("🟡 *まもなく整備時期（交換作業）*", warn)
          if not overdue and not warn:
              blocks.append({"type": "section", "text": {"type": "mrkdwn",
                  "text": "🟢 *全車両、交換整備はスケジュール内です！*"}})
          if checks:
              section_with_rows("🔵 *点検・清掃の推奨時期（緊急ではありません）*", checks, check_line)
          if ok:
              section_with_rows("🟢 *スケジュール内*", ok)
          if grounded:
              gtext = "\n".join(f"• *{t}* — {i['note']}" for t, i in grounded)
              blocks.append({"type": "section", "text": {"type": "mrkdwn", "text": f"🟣 *整備・修理中*\n{gtext}"}})

          blocks.append({"type": "divider"})
          blocks.append({"type": "context", "elements": [{"type": "mrkdwn",
              "text": "▓ = 整備インターバル消化率 ｜ 🔴🟡 交換作業 ｜ 🔵 点検・清掃 ｜ <https://geoffrey-fitzjarrell-ai.github.io/generator_servicing/|📊 ダッシュボード> ｜ 本日も安全運行をよろしくお願いします🙏"}]})

          # Plain-text fallback for notifications / clients that don't render blocks.
          fallback = f"{header} — 超過{len(overdue)}台 / まもなく{len(warn)}台 / 点検{len(checks)}台 / 修理中{len(grounded)}台"

          result = slack_post({"channel": CHANNEL, "text": fallback, "blocks": blocks})
          print("Posted." if result.get("ok") else f"Failed: {result.get('error')}")

          # ---- Direct alerts: DM Geoff + Masakiyo on NEW warn/overdue (edge-triggered) ----
          # overdue/warn are REPLACEMENT-only now, so visual checks never DM anyone.
          # service_alert_state.json records the last level alerted per truck so nobody is
          # re-pinged daily for the same thing. A truck must leave warn/overdue (serviced or
          # grounded) and come back to alert again; warn -> overdue counts as a new alert.
          # (uid, lang) — Geoff gets English, Masakiyo gets Japanese.
          ALERT_RECIPIENTS = [("U07RU3LH24F", "en"), ("U0BBE3JUHUY", "jp")]
          STATE_PATH  = "service_alert_state.json"

          def gh_get_state():
              url = f"https://api.github.com/repos/{REPO}/contents/{STATE_PATH}"
              req = urllib.request.Request(url, headers={
                  "Authorization": f"Bearer {GH_TOKEN}", "Accept": "application/vnd.github+json"})
              try:
                  with _urlopen(req) as r:
                      resp = json.loads(r.read())
                  return json.loads(base64.b64decode(resp["content"]).decode()), resp["sha"]
              except _ue.HTTPError as e:
                  if e.code == 404:
                      return {}, None
                  raise

          def gh_put_state(obj, sha):
              url = f"https://api.github.com/repos/{REPO}/contents/{STATE_PATH}"
              body = {
                  "message": "chore: update service alert state [skip ci]",
                  "content": base64.b64encode(
                      json.dumps(obj, ensure_ascii=False, indent=2).encode()).decode(),
              }
              if sha:
                  body["sha"] = sha
              req = urllib.request.Request(url, data=json.dumps(body).encode(), method="PUT",
                  headers={"Authorization": f"Bearer {GH_TOKEN}",
                           "Accept": "application/vnd.github+json",
                           "Content-Type": "application/json"})
              with _urlopen(req) as r:
                  return json.loads(r.read())

          prev, sha = gh_get_state()
          cur = {t: "overdue" for t, _ in overdue}
          cur.update({t: "warn" for t, _ in warn})

          # Fire when a truck newly enters overdue (incl. warn -> overdue escalation) or warn.
          fired_over = [(t, i) for t, i in overdue if prev.get(t) != "overdue"]
          fired_warn = [(t, i) for t, i in warn    if prev.get(t) is None]
          # Recovery: a truck that WAS in warn/overdue and is now clear -> notify recipients.
          cleared = sorted(t for t in prev if t not in cur)

          if fired_over or fired_warn:
              L = {
                  "en": {"head": "🔧 Service due", "over": "🔴 *Overdue*",
                         "warn": "🟡 *Coming due*", "link": "📊 Dashboard",
                         "row": row_line_en,
                         "fb": f"Service due — {len(fired_over)} overdue / {len(fired_warn)} coming due"},
                  "jp": {"head": "🔧 整備アラート", "over": "🔴 *整備期限超過*",
                         "warn": "🟡 *まもなく整備*", "link": "📊 ダッシュボード",
                         "row": row_line,
                         "fb": f"整備アラート — 超過{len(fired_over)}台 / まもなく{len(fired_warn)}台"},
              }

              def build_blocks(lang):
                  cfg = L[lang]
                  blk = [{"type": "header", "text": {"type": "plain_text",
                      "text": cfg["head"], "emoji": True}}]
                  if fired_over:
                      b = "\n".join(cfg["row"](t, i) for t, i in fired_over)
                      blk.append({"type": "section", "text": {"type": "mrkdwn",
                          "text": f"{cfg['over']}\n```{b}```"}})
                  if fired_warn:
                      b = "\n".join(cfg["row"](t, i) for t, i in fired_warn)
                      blk.append({"type": "section", "text": {"type": "mrkdwn",
                          "text": f"{cfg['warn']}\n```{b}```"}})
                  blk.append({"type": "context", "elements": [{"type": "mrkdwn",
                      "text": f"<https://geoffrey-fitzjarrell-ai.github.io/generator_servicing/|{cfg['link']}>"}]})
                  return blk

              for uid, lang in ALERT_RECIPIENTS:
                  res = slack_post({"channel": uid, "text": L[lang]["fb"],
                                    "blocks": build_blocks(lang)})
                  print(f"DM {uid} ({lang}): " + ("ok" if res.get("ok") else f"FAILED {res.get('error')}"))
          else:
              print("No new warn/overdue transitions; no DM sent.")

          # Recovery DM — edge-triggered when a truck returns to schedule (serviced/grounded).
          if cleared:
              REC = {"en": ("✅ Back on schedule", "returned to schedule"),
                     "jp": ("✅ 整備スケジュール内に復帰", "が整備スケジュール内に戻りました")}
              for uid, lang in ALERT_RECIPIENTS:
                  head, phr = REC[lang]
                  listing = ", ".join(cleared)
                  txt = (f"{listing} {phr}." if lang == "en" else f"{listing}{phr}。")
                  res = slack_post({"channel": uid, "text": f"{head} — {listing}",
                                    "blocks": [
                                        {"type": "header", "text": {"type": "plain_text", "text": head, "emoji": True}},
                                        {"type": "section", "text": {"type": "mrkdwn", "text": txt}},
                                    ]})
                  print(f"recovery DM {uid} ({lang}): " + ("ok" if res.get("ok") else f"FAILED {res.get('error')}"))

          # Persist current levels; trucks now ok/grounded drop out so a future re-entry
          # alerts again. Only write when something changed.
          if cur != prev:
              try:
                  put = gh_put_state(cur, sha)
                  print("State updated." if put.get("content") else f"State write failed: {put}")
              except Exception as e:
                  print(f"State write error: {e}")
          else:
              print("State unchanged.")
          EOF
