name: Sync Fleetio Vehicle Data

# Group-scoped sync of the JP VOPS HD trucks. Pulls per-truck: vehicle record,
# recent service entries, and last-known location (Fleetio location_entries).
# Writes fleetio.json. Bounded + deduped => no runaway paging, no rate limits.
on:
  schedule:
    - cron: '0 21 * * *'   # 06:00 JST daily
  workflow_dispatch:

jobs:
  fleetio-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Pull Fleetio data and commit
        env:
          FLEETIO_API_KEY: ${{ secrets.FLEETIO_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          python3 - <<'EOF'
          import os, json, base64, time, re, traceback
          import urllib.request, urllib.parse, urllib.error as _ue
          from datetime import datetime, timezone

          FLEETIO_KEY   = os.environ["FLEETIO_API_KEY"]
          GH_TOKEN      = os.environ["GH_TOKEN"]
          ACCOUNT_TOKEN = "a0294e2c81"
          REPO          = "Geoffrey-Fitzjarrell-ai/generator_servicing"
          FLEETIO_BASE  = "https://secure.fleetio.com/api/v1"
          NOW           = datetime.now(timezone.utc)
          DECOMMISSIONED = {"HD18"}

          def _urlopen(req, timeout=25, tries=4):
              for i in range(tries):
                  try:
                      return urllib.request.urlopen(req, timeout=timeout)
                  except _ue.HTTPError as e:
                      if e.code in (429,500,502,503,504) and i < tries-1:
                          time.sleep(2**i); continue
                      raise
                  except _ue.URLError:
                      if i < tries-1:
                          time.sleep(2**i); continue
                      raise

          def fleetio_get(path, params=None):
              url = f"{FLEETIO_BASE}/{path}"
              if params:
                  url += "?" + urllib.parse.urlencode(params, doseq=True)
              req = urllib.request.Request(url, headers={
                  "Authorization": f"Token {FLEETIO_KEY}",
                  "Account-Token": ACCOUNT_TOKEN, "Accept": "application/json"})
              with _urlopen(req) as r:
                  return json.loads(r.read())

          def records_of(resp):
              if isinstance(resp, dict): return resp.get("records", [])
              return resp if isinstance(resp, list) else []

          def hd_key(name):
              m = re.search(r"HD\s*0*(\d+)", str(name or "").upper())
              return f"HD{int(m.group(1))}" if m else None

          out = {"generated_at": NOW.isoformat(), "source": "fleetio", "account": ACCOUNT_TOKEN}
          try:
              # ---- list all group vehicles (bounded, deduped) ----
              all_vehicles, seen, page = [], set(), 1
              while page <= 5:
                  recs = records_of(fleetio_get("vehicles", {"per_page": 100, "page": page}))
                  new = [v for v in recs if v.get("id") not in seen]
                  if not new: break
                  for v in new: seen.add(v.get("id"))
                  all_vehicles.extend(new)
                  if len(recs) < 100: break
                  page += 1
              print(f"listed {len(all_vehicles)} vehicle(s)")

              trucks, others = {}, []
              svc_fields = [None]; loc_fields = [None]

              def newest_location(vid):
                  try:
                      les = records_of(fleetio_get(f"vehicles/{vid}/location_entries", {"per_page": 10}))
                  except Exception as e:
                      return {"error": str(e)[:120]}
                  if not les: return None
                  les.sort(key=lambda x:(1 if x.get("is_current") else 0,
                                         str(x.get("date") or x.get("created_at") or "")), reverse=True)
                  e0 = les[0]
                  if loc_fields[0] is None: loc_fields[0] = sorted(e0.keys())
                  geo = e0.get("geolocation") if isinstance(e0.get("geolocation"), dict) else {}
                  loc = {
                      "address": e0.get("address") or e0.get("location"),
                      "lat": geo.get("latitude") or e0.get("latitude"),
                      "lng": geo.get("longitude") or e0.get("longitude"),
                      "at":  e0.get("date") or e0.get("created_at"),
                      "is_current": e0.get("is_current"),
                  }
                  return {kk:vv for kk,vv in loc.items() if vv is not None} or None

              def recent_services(vid):
                  try:
                      se = records_of(fleetio_get(f"vehicles/{vid}/service_entries", {"per_page": 5}))
                  except Exception as e:
                      return [{"error": str(e)[:120]}]
                  rows = []
                  for s in se:
                      if svc_fields[0] is None: svc_fields[0] = sorted(s.keys())
                      pme = s.get("primary_meter_entry") or {}
                      rows.append({
                          "id": s.get("id"), "status": s.get("status"),
                          "completed_at": s.get("completed_at"), "started_at": s.get("started_at"),
                          "vendor": s.get("vendor_name"), "reference": s.get("reference"),
                          "labels": s.get("labels"),
                          "meter": pme.get("value") if isinstance(pme, dict) else pme,
                      })
                  return rows

              for v in all_vehicles:
                  k = hd_key(v.get("name"))
                  if not k:
                      others.append(v.get("name")); continue
                  if k in DECOMMISSIONED: continue
                  vid = v.get("id")
                  rec = {
                      "fleetio_id": vid, "name": v.get("name"),
                      "make": v.get("make"), "model": v.get("model"), "year": v.get("year"),
                      "vin": v.get("vin"),
                      "status": v.get("vehicle_status_name") or v.get("status"),
                      "meter": {"value": v.get("current_meter_value") or v.get("primary_meter_value"),
                                "unit": v.get("primary_meter_unit")},
                      "recent_service_entries": recent_services(vid),
                      "location": newest_location(vid),
                  }
                  trucks[k] = rec
                  L = rec["location"]
                  print(f"  {k}: {rec['name']} {rec['meter']['value']}{rec['meter']['unit']} "
                        f"{rec['status']} svc={len(rec['recent_service_entries'])} "
                        f"loc={(L.get('address') if isinstance(L,dict) else L)}")
                  time.sleep(0.3)

              out.update({
                  "total_listed": len(all_vehicles), "truck_count": len(trucks),
                  "decommissioned_skipped": sorted(DECOMMISSIONED),
                  "trucks": trucks, "other_group_vehicles": sorted(others),
                  "_service_entry_fields": svc_fields[0], "_location_entry_fields": loc_fields[0],
              })
          except Exception:
              out["_fatal"] = traceback.format_exc()[-1500:]
              out.setdefault("trucks", {})
              print("FATAL:\n" + out["_fatal"])

          # ---- commit fleetio.json ----
          def gh_get_sha(path):
              url=f"https://api.github.com/repos/{REPO}/contents/{path}"
              req=urllib.request.Request(url, headers={"Authorization":f"Bearer {GH_TOKEN}","Accept":"application/vnd.github+json"})
              try:
                  with _urlopen(req) as r: return json.loads(r.read()).get("sha")
              except _ue.HTTPError as e:
                  if e.code==404: return None
                  raise
          def gh_put(path, content, message):
              url=f"https://api.github.com/repos/{REPO}/contents/{path}"
              payload={"message":message,"content":base64.b64encode(json.dumps(content,indent=2).encode()).decode()}
              sha=gh_get_sha(path)
              if sha: payload["sha"]=sha
              req=urllib.request.Request(url,data=json.dumps(payload).encode(),headers={
                  "Authorization":f"Bearer {GH_TOKEN}","Accept":"application/vnd.github+json","Content-Type":"application/json"},method="PUT")
              with _urlopen(req) as r: r.read()

          gh_put("fleetio.json", out, f"chore: sync Fleetio ({out.get('truck_count','?')} trucks) [skip ci]")
          print("Committed fleetio.json")
          if out.get("_fatal"): raise SystemExit(1)
          EOF
