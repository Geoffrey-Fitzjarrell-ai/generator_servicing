name: Sync Fleetio Vehicle Data

# Group-scoped sync: pulls every vehicle in the JP VOPS group (id 1999094),
# maps each to its HD key, skips decommissioned trucks, records recent service
# entries. Bounded to one small group => no whole-fleet paging, no rate limits.
# Manual-only until go-live cron is confirmed.
on:
  workflow_dispatch:

jobs:
  fleetio-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Pull Fleetio data and commit
        env:
          FLEETIO_API_KEY: ${{ secrets.FLEETIO_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          python3 - <<'EOF'
          import os, json, base64, time, re
          import urllib.request, urllib.parse, urllib.error as _ue
          from datetime import datetime, timezone

          FLEETIO_KEY   = os.environ["FLEETIO_API_KEY"]
          GH_TOKEN      = os.environ["GH_TOKEN"]
          ACCOUNT_TOKEN = "a0294e2c81"
          GROUP_ID      = 1999094           # JP VOPS group (from saved-view URL)
          REPO          = "Geoffrey-Fitzjarrell-ai/generator_servicing"
          FLEETIO_BASE  = "https://secure.fleetio.com/api/v1"
          NOW           = datetime.now(timezone.utc)
          DECOMMISSIONED = {"HD18"}

          def _urlopen(req, timeout=25, tries=4):
              for i in range(tries):
                  try:
                      return urllib.request.urlopen(req, timeout=timeout)
                  except _ue.HTTPError as e:
                      if e.code in (429,500,502,503,504) and i < tries-1:
                          time.sleep(2**i); continue
                      raise
                  except _ue.URLError:
                      if i < tries-1:
                          time.sleep(2**i); continue
                      raise

          def fleetio_get(path, params=None):
              url = f"{FLEETIO_BASE}/{path}"
              if params:
                  url += "?" + urllib.parse.urlencode(params, doseq=True)
              req = urllib.request.Request(url, headers={
                  "Authorization": f"Token {FLEETIO_KEY}",
                  "Account-Token": ACCOUNT_TOKEN,
                  "Accept": "application/json"})
              with _urlopen(req) as r:
                  return json.loads(r.read())

          def records_of(resp):
              if isinstance(resp, dict): return resp.get("records", [])
              return resp if isinstance(resp, list) else []

          def hd_key(name):
              m = re.search(r"HD\s*0*(\d+)", str(name or "").upper())
              return f"HD{int(m.group(1))}" if m else None

          # ---- discover group vehicles (bounded page loop, hard cap) ----
          group_vehicles, filter_used = [], None
          for label, extra in [
              ("group_id_eq", {"q[group_id_eq]": GROUP_ID}),
              ("group_id_cont_any_slash", {"q[group_id_cont_any_slash][]": GROUP_ID}),
          ]:
              try:
                  seen_ids, page, acc = set(), 1, []
                  while page <= 5:
                      params = {"per_page": 100, "page": page, **extra}
                      recs = records_of(fleetio_get("vehicles", params))
                      new = [v for v in recs if v.get("id") not in seen_ids]
                      if not new: break
                      for v in new: seen_ids.add(v.get("id"))
                      acc.extend(new)
                      if len(recs) < 100: break
                      page += 1
                  if acc:
                      group_vehicles, filter_used = acc, label
                      break
              except _ue.HTTPError as e:
                  print(f"group filter {label}: HTTP {e.code}")

          print(f"group {GROUP_ID}: {len(group_vehicles)} vehicle(s) via '{filter_used}'")

          trucks, unmapped, sample_keys = {}, {}, None
          for v in group_vehicles:
              vid, name = v.get("id"), v.get("name")
              k = hd_key(name)
              rec = {
                  "fleetio_id": vid, "name": name,
                  "make": v.get("make"), "model": v.get("model"), "year": v.get("year"),
                  "vin": v.get("vin"),
                  "status": v.get("vehicle_status_name") or v.get("status"),
                  "meter": {"value": v.get("current_meter_value") or v.get("primary_meter_value"),
                            "unit": v.get("primary_meter_unit")},
              }
              if k in DECOMMISSIONED:
                  print(f"  skip decommissioned {k}"); continue
              # recent service entries (nested route = reliable per-vehicle filter)
              services = []
              try:
                  recs = records_of(fleetio_get(f"vehicles/{vid}/service_entries", {"per_page": 5}))
                  if recs and sample_keys is None: sample_keys = sorted(recs[0].keys())
                  for s in recs:
                      pme = s.get("primary_meter_entry") or {}
                      services.append({
                          "id": s.get("id"),
                          "status": s.get("status"),
                          "completed_at": s.get("completed_at"),
                          "started_at": s.get("started_at"),
                          "vendor": s.get("vendor_name"),
                          "reference": s.get("reference"),
                          "labels": s.get("labels"),
                          "meter": pme.get("value") if isinstance(pme, dict) else pme,
                      })
              except _ue.HTTPError as e:
                  services = [{"error": f"HTTP {e.code}"}]
              rec["recent_service_entries"] = services
              (trucks if k else unmapped)[k or str(vid)] = rec
              print(f"  {k or 'UNMAPPED'}: {name} {rec['meter']['value']}{rec['meter']['unit']} "
                    f"{rec['status']} services={len(services)}")
              time.sleep(0.3)

          out = {
              "generated_at": NOW.isoformat(), "source": "fleetio",
              "account": ACCOUNT_TOKEN, "group_id": GROUP_ID, "filter_used": filter_used,
              "truck_count": len(trucks), "decommissioned_skipped": sorted(DECOMMISSIONED),
              "trucks": trucks, "unmapped": unmapped,
              "_service_entry_fields": sample_keys,
          }

          def gh_get_sha(path):
              url=f"https://api.github.com/repos/{REPO}/contents/{path}"
              req=urllib.request.Request(url, headers={"Authorization":f"Bearer {GH_TOKEN}","Accept":"application/vnd.github+json"})
              try:
                  with _urlopen(req) as r: return json.loads(r.read()).get("sha")
              except _ue.HTTPError as e:
                  if e.code==404: return None
                  raise
          def gh_put(path, content, message):
              url=f"https://api.github.com/repos/{REPO}/contents/{path}"
              payload={"message":message,"content":base64.b64encode(json.dumps(content,indent=2).encode()).decode()}
              sha=gh_get_sha(path)
              if sha: payload["sha"]=sha
              req=urllib.request.Request(url,data=json.dumps(payload).encode(),headers={
                  "Authorization":f"Bearer {GH_TOKEN}","Accept":"application/vnd.github+json","Content-Type":"application/json"},method="PUT")
              with _urlopen(req) as r: r.read()

          gh_put("fleetio.json", out, f"chore: sync Fleetio group {GROUP_ID} ({len(trucks)} trucks) [skip ci]")
          print(f"Committed fleetio.json — {len(trucks)} mapped, {len(unmapped)} unmapped")
          EOF
