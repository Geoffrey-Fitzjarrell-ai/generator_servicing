name: Sync Fleetio Vehicle Data

# v1: manual trigger only. Once the response shape is confirmed from a run,
# a schedule + dashboard read will be added. Writes fleetio.json (new file,
# does not touch existing data.json / service_*.json).
on:
  workflow_dispatch:

jobs:
  fleetio-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Pull Fleetio data and commit
        env:
          FLEETIO_API_KEY: ${{ secrets.FLEETIO_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          python3 - <<'EOF'
          import os, json, re, base64, time
          import urllib.request, urllib.parse, urllib.error as _ue
          from datetime import datetime, timezone

          FLEETIO_KEY   = os.environ["FLEETIO_API_KEY"]
          GH_TOKEN      = os.environ["GH_TOKEN"]
          ACCOUNT_TOKEN = "a0294e2c81"          # non-secret: it's the URL slug
          REPO          = "Geoffrey-Fitzjarrell-ai/generator_servicing"
          FLEETIO_BASE  = "https://secure.fleetio.com/api/v1"
          NOW           = datetime.now(timezone.utc)

          def _urlopen(req, timeout=30, tries=4):
              for i in range(tries):
                  try:
                      return urllib.request.urlopen(req, timeout=timeout)
                  except _ue.HTTPError as e:
                      if e.code in (429, 500, 502, 503, 504) and i < tries - 1:
                          time.sleep(2 ** i); continue
                      raise
                  except _ue.URLError:
                      if i < tries - 1:
                          time.sleep(2 ** i); continue
                      raise

          def fleetio_get(path, params=None):
              url = f"{FLEETIO_BASE}/{path}"
              if params:
                  url += "?" + urllib.parse.urlencode(params)
              req = urllib.request.Request(url, headers={
                  "Authorization": f"Token {FLEETIO_KEY}",
                  "Account-Token": ACCOUNT_TOKEN,
                  "Accept": "application/json",
              })
              with _urlopen(req) as r:
                  return json.loads(r.read()), r.status

          # ---- 1. List all vehicles (paginated) ----
          vehicles = []
          page = 1
          while True:
              try:
                  data, status = fleetio_get("vehicles", {"per_page": 100, "page": page})
              except _ue.HTTPError as e:
                  print(f"ERROR vehicles page {page}: HTTP {e.code} {e.reason}")
                  print("Body:", e.read().decode()[:400])
                  raise SystemExit(1)
              # Fleetio may return a bare list or a paginated object
              records = data.get("records", data) if isinstance(data, dict) else data
              if not records:
                  break
              vehicles.extend(records)
              if len(records) < 100:
                  break
              page += 1

          print(f"OK vehicles: {len(vehicles)} record(s)")

          def hd_key(name):
              m = re.search(r"HD\s*0*(\d+)", str(name or "").upper())
              return f"HD{int(m.group(1))}" if m else None

          mapped, unmapped = {}, {}
          for v in vehicles:
              vid   = v.get("id")
              name  = v.get("name")
              entry = {
                  "fleetio_id": vid,
                  "name":       name,
                  "make":       v.get("make"),
                  "model":      v.get("model"),
                  "year":       v.get("year"),
                  "status":     v.get("vehicle_status_name") or v.get("status"),
                  "meter":      {
                      "value": v.get("current_meter_value") or v.get("primary_meter_value"),
                      "unit":  v.get("primary_meter_unit"),
                  },
              }
              k = hd_key(name)
              print(f"  vehicle {vid}: name={name!r} -> {k or 'UNMAPPED'} | meter={entry['meter']['value']} {entry['meter']['unit']}")
              (mapped if k else unmapped)[k or str(vid)] = entry

          # ---- 2. Probe service-entries shape for the known vehicle (4608057) ----
          # Try the filter forms Fleetio has used; record whichever returns 200.
          probe = {"vehicle_id": 4608057, "results": None, "form_used": None}
          for label, params in [
              ("q[vehicle_id_eq]", {"q[vehicle_id_eq]": 4608057, "per_page": 3}),
              ("vehicle_id",       {"vehicle_id": 4608057, "per_page": 3}),
          ]:
              try:
                  se, status = fleetio_get("service_entries", params)
                  recs = se.get("records", se) if isinstance(se, dict) else se
                  probe["form_used"] = label
                  probe["results"] = len(recs) if isinstance(recs, list) else "non-list"
                  sample = recs[0] if isinstance(recs, list) and recs else None
                  print(f"OK service_entries via {label}: {probe['results']} record(s)")
                  if sample:
                      print("  sample keys:", sorted(sample.keys())[:20])
                  break
              except _ue.HTTPError as e:
                  print(f"  service_entries via {label}: HTTP {e.code}")

          out = {
              "generated_at": NOW.isoformat(),
              "source": "fleetio",
              "account": ACCOUNT_TOKEN,
              "vehicle_count": len(vehicles),
              "vehicles": mapped,
              "unmapped": unmapped,
              "_service_entries_probe": probe,
          }

          # ---- 3. Commit fleetio.json via GitHub contents API ----
          def gh_get_sha(path):
              url = f"https://api.github.com/repos/{REPO}/contents/{path}"
              req = urllib.request.Request(url, headers={
                  "Authorization": f"Bearer {GH_TOKEN}",
                  "Accept": "application/vnd.github+json"})
              try:
                  with _urlopen(req) as r:
                      return json.loads(r.read()).get("sha")
              except _ue.HTTPError as e:
                  if e.code == 404:
                      return None
                  raise

          def gh_put(path, content, message):
              url = f"https://api.github.com/repos/{REPO}/contents/{path}"
              payload = {"message": message,
                         "content": base64.b64encode(json.dumps(content, indent=2).encode()).decode()}
              sha = gh_get_sha(path)
              if sha:
                  payload["sha"] = sha
              req = urllib.request.Request(url, data=json.dumps(payload).encode(), headers={
                  "Authorization": f"Bearer {GH_TOKEN}",
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json"}, method="PUT")
              with _urlopen(req) as r:
                  r.read()

          gh_put("fleetio.json", out,
                 f"chore: sync Fleetio vehicle data ({len(vehicles)} vehicles) [skip ci]")
          print("Committed fleetio.json")
          EOF
