name: Sync Fleetio Vehicle Data

# Targeted sync: pulls the 14 HD trucks by Fleetio ID (no whole-fleet paging,
# no rate-limit risk). Writes fleetio.json (new file; does not touch existing data).
# v2: still manual-only until the committed file is confirmed, then a cron is added.
on:
  workflow_dispatch:

jobs:
  fleetio-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Pull Fleetio data and commit
        env:
          FLEETIO_API_KEY: ${{ secrets.FLEETIO_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          python3 - <<'EOF'
          import os, json, base64, time
          import urllib.request, urllib.parse, urllib.error as _ue
          from datetime import datetime, timezone

          FLEETIO_KEY   = os.environ["FLEETIO_API_KEY"]
          GH_TOKEN      = os.environ["GH_TOKEN"]
          ACCOUNT_TOKEN = "a0294e2c81"
          REPO          = "Geoffrey-Fitzjarrell-ai/generator_servicing"
          FLEETIO_BASE  = "https://secure.fleetio.com/api/v1"
          NOW           = datetime.now(timezone.utc)

          # HD -> Fleetio vehicle id (discovered from the account, verified 2026-08-05)
          HD_FLEET = {
              "HD5": 4456463, "HD6": 4335601, "HD7": 4335602, "HD8": 4335603,
              "HD9": 4335604, "HD10": 4335605, "HD11": 4335606, "HD12": 4608053,
              "HD13": 4608054, "HD14": 4608055, "HD15": 4608056, "HD16": 4608057,
              "HD17": 4608058, "HD18": 4608059,
          }
          DECOMMISSIONED = {"HD18"}   # mirror dashboard: skip decommissioned trucks

          def _urlopen(req, timeout=25, tries=4):
              for i in range(tries):
                  try:
                      return urllib.request.urlopen(req, timeout=timeout)
                  except _ue.HTTPError as e:
                      if e.code in (429, 500, 502, 503, 504) and i < tries - 1:
                          time.sleep(2 ** i); continue
                      raise
                  except _ue.URLError:
                      if i < tries - 1:
                          time.sleep(2 ** i); continue
                      raise

          def fleetio_get(path, params=None):
              url = f"{FLEETIO_BASE}/{path}"
              if params:
                  url += "?" + urllib.parse.urlencode(params)
              req = urllib.request.Request(url, headers={
                  "Authorization": f"Token {FLEETIO_KEY}",
                  "Account-Token": ACCOUNT_TOKEN,
                  "Accept": "application/json"})
              with _urlopen(req) as r:
                  return json.loads(r.read())

          def records_of(resp):
              if isinstance(resp, dict):
                  return resp.get("records", [])
              return resp if isinstance(resp, list) else []

          vehicles = {}
          sample_service_keys = None
          for hd, vid in HD_FLEET.items():
              if hd in DECOMMISSIONED:
                  continue
              try:
                  v = fleetio_get(f"vehicles/{vid}")
              except _ue.HTTPError as e:
                  vehicles[hd] = {"fleetio_id": vid, "error": f"HTTP {e.code}"}
                  print(f"{hd}: vehicle fetch HTTP {e.code}")
                  continue

              # recent service entries via nested route (reliable per-vehicle filter)
              services = []
              try:
                  se = fleetio_get(f"vehicles/{vid}/service_entries", {"per_page": 5})
                  recs = records_of(se)
                  if recs and sample_service_keys is None:
                      sample_service_keys = sorted(recs[0].keys())
                  for s in recs:
                      services.append({
                          "id": s.get("id"),
                          "completed_at": s.get("completed_at") or s.get("started_at"),
                          "meter": s.get("starting_meter_value") or s.get("completed_meter_value"),
                          "total_amount": s.get("total_amount_cents"),
                          "summary": (s.get("labels") or s.get("comments_count")),
                      })
              except _ue.HTTPError as e:
                  services = [{"error": f"HTTP {e.code}"}]

              vehicles[hd] = {
                  "fleetio_id": vid,
                  "name": v.get("name"),
                  "make": v.get("make"),
                  "model": v.get("model"),
                  "year": v.get("year"),
                  "vin": v.get("vin"),
                  "status": v.get("vehicle_status_name") or v.get("status"),
                  "meter": {"value": v.get("current_meter_value") or v.get("primary_meter_value"),
                            "unit": v.get("primary_meter_unit")},
                  "recent_service_entries": services,
              }
              print(f"{hd}: {v.get('name')} meter={vehicles[hd]['meter']['value']}{vehicles[hd]['meter']['unit']} "
                    f"status={vehicles[hd]['status']} services={len(services)}")
              time.sleep(0.3)   # gentle on rate limits

          out = {
              "generated_at": NOW.isoformat(),
              "source": "fleetio",
              "account": ACCOUNT_TOKEN,
              "truck_count": len(vehicles),
              "decommissioned_skipped": sorted(DECOMMISSIONED),
              "trucks": vehicles,
              "_service_entry_fields": sample_service_keys,
          }

          def gh_get_sha(path):
              url = f"https://api.github.com/repos/{REPO}/contents/{path}"
              req = urllib.request.Request(url, headers={
                  "Authorization": f"Bearer {GH_TOKEN}", "Accept": "application/vnd.github+json"})
              try:
                  with _urlopen(req) as r:
                      return json.loads(r.read()).get("sha")
              except _ue.HTTPError as e:
                  if e.code == 404: return None
                  raise

          def gh_put(path, content, message):
              url = f"https://api.github.com/repos/{REPO}/contents/{path}"
              payload = {"message": message,
                         "content": base64.b64encode(json.dumps(content, indent=2).encode()).decode()}
              sha = gh_get_sha(path)
              if sha: payload["sha"] = sha
              req = urllib.request.Request(url, data=json.dumps(payload).encode(), headers={
                  "Authorization": f"Bearer {GH_TOKEN}", "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json"}, method="PUT")
              with _urlopen(req) as r:
                  r.read()

          gh_put("fleetio.json", out, f"chore: sync Fleetio ({len(vehicles)} HD trucks) [skip ci]")
          print(f"Committed fleetio.json — {len(vehicles)} trucks")
          EOF
